<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم — DigitalZone</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b12;--surface:#0f1420;--surface2:#161c2e;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--accent:#3b82f6;--accent2:#6366f1;--text:#f0f2f8;--muted:#7a82a0;--success:#22c55e;--error:#ef4444;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;min-height:100vh;}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:40px;width:100%;max-width:380px;text-align:center;}
.login-logo{font-family:'Space Mono',monospace;font-size:22px;margin-bottom:8px;}
.login-logo span{color:var(--accent);}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:32px;}
.login-input{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:12px 16px;border-radius:10px;font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;text-align:center;letter-spacing:4px;}
.login-input::placeholder{letter-spacing:0;color:var(--muted);}
.login-input:focus{border-color:var(--accent);}
.btn-login{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:none;padding:13px;border-radius:10px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:4px;}
.login-err{color:var(--error);font-size:13px;margin-top:10px;display:none;}

/* MAIN */
.main-wrap{display:none;}
nav{position:sticky;top:0;z-index:100;background:rgba(8,11,18,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{font-family:'Space Mono',monospace;font-size:16px;}
.nav-logo span{color:var(--accent);}
.nav-actions{display:flex;gap:10px;align-items:center;}
.btn-sm{background:var(--surface2);border:1px solid var(--border2);color:var(--muted);padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-sm:hover{color:var(--text);border-color:var(--border2);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:white;}
.btn-primary:hover{background:#2563eb;color:white;}
.btn-danger{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#f87171;}
.btn-danger:hover{background:rgba(239,68,68,0.2);color:#f87171;}

.container{max-width:1100px;margin:0 auto;padding:32px 1.5rem 80px;}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:0;}
.tab{background:none;border:none;color:var(--muted);padding:10px 20px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.tab-content{display:none;}
.tab-content.active{display:block;}

/* SECTION HEADER */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.section-title{font-size:18px;font-weight:600;}

/* PRODUCTS TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.table-head{display:grid;grid-template-columns:40px 1fr 100px 80px 80px 100px;gap:12px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);font-weight:500;}
.table-row{display:grid;grid-template-columns:40px 1fr 100px 80px 80px 100px;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);align-items:center;transition:background 0.15s;}
.table-row:last-child{border-bottom:none;}
.table-row:hover{background:rgba(255,255,255,0.02);}
.row-icon{font-size:24px;text-align:center;}
.row-name{font-size:14px;font-weight:500;}
.row-desc{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-cat{font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);padding:3px 10px;border-radius:20px;display:inline-block;}
.row-price{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--accent);}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-block;}
.badge-hot{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;}
.badge-new{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.25);color:#4ade80;}
.badge-none{color:var(--muted);font-size:12px;}
.row-actions{display:flex;gap:6px;}
.btn-edit{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);color:#93c5fd;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;}
.btn-edit:hover{background:rgba(59,130,246,0.2);}
.btn-del{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:#f87171;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;}
.btn-del:hover{background:rgba(239,68,68,0.18);}

/* CATEGORIES */
.cats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;}
.cat-icon{font-size:28px;}
.cat-info{flex:1;}
.cat-label{font-size:14px;font-weight:500;}
.cat-id{font-size:12px;color:var(--muted);margin-top:2px;}
.cat-actions{display:flex;gap:6px;}

/* SETTINGS */
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px;}
.settings-title{font-size:15px;font-weight:600;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field-group{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:13px;color:var(--muted);}
.field-input{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:border-color 0.2s;}
.field-input:focus{border-color:var(--accent);}
.field-full{grid-column:1/-1;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:28px;}
.modal-title{font-size:18px;font-weight:600;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;}
.modal-fields{display:flex;flex-direction:column;gap:14px;}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;gap:10px;margin-top:24px;justify-content:flex-end;}
.features-list{display:flex;flex-direction:column;gap:6px;}
.feature-item{display:flex;gap:6px;align-items:center;}
.feature-item .field-input{flex:1;}
.btn-add-feature{background:none;border:1px dashed var(--border2);color:var(--muted);padding:8px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;width:100%;margin-top:4px;}
.btn-add-feature:hover{border-color:var(--accent);color:var(--accent);}
.btn-rm-feature{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 6px;line-height:1;}
.btn-rm-feature:hover{color:#f87171;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:12px 20px;border-radius:10px;font-size:14px;z-index:300;transition:transform 0.3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* SAVE BAR */
.save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border2);padding:14px 24px;display:none;align-items:center;justify-content:space-between;z-index:150;}
.save-bar.show{display:flex;}
.save-bar-text{font-size:14px;color:var(--muted);}

@media(max-width:640px){
  .table-head,.table-row{grid-template-columns:36px 1fr 70px 80px;}
  .table-head .h-cat,.table-row .row-cat,.table-head .h-badge,.table-row .row-badge{display:none;}
  .field-grid,.modal-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-logo">Digital<span>Zone</span></div>
    <div class="login-sub">لوحة التحكم — أدخل كلمة المرور</div>
    <input type="password" class="login-input" id="pass-input" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-login" onclick="doLogin()">دخول</button>
    <div class="login-err" id="login-err">كلمة المرور غير صحيحة</div>
  </div>
</div>

<!-- MAIN -->
<div class="main-wrap" id="main-wrap">
  <nav>
    <div class="nav-logo">Digital<span>Zone</span> <span style="color:var(--muted);font-size:12px;margin-right:8px;">لوحة التحكم</span></div>
    <div class="nav-actions">
      <a href="/" class="btn-sm" target="_blank">🌐 الموقع</a>
      <button class="btn-sm" onclick="doLogout()">خروج</button>
    </div>
  </nav>

  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('products',this)">📦 المنتجات</button>
      <button class="tab" onclick="switchTab('categories',this)">🗂️ الفئات</button>
      <button class="tab" onclick="switchTab('settings',this)">⚙️ الإعدادات</button>
    </div>

    <!-- PRODUCTS TAB -->
    <div class="tab-content active" id="tab-products">
      <div class="section-header">
        <div class="section-title">المنتجات <span id="prod-count" style="color:var(--muted);font-size:14px;font-weight:400;"></span></div>
        <button class="btn-sm btn-primary" onclick="openProductModal()">+ منتج جديد</button>
      </div>
      <div class="table-wrap">
        <div class="table-head">
          <div></div><div>المنتج</div>
          <div class="h-cat">الفئة</div>
          <div>السعر</div>
          <div class="h-badge">الشارة</div>
          <div>إجراءات</div>
        </div>
        <div id="products-list"></div>
      </div>
    </div>

    <!-- CATEGORIES TAB -->
    <div class="tab-content" id="tab-categories">
      <div class="section-header">
        <div class="section-title">الفئات</div>
        <button class="btn-sm btn-primary" onclick="openCatModal()">+ فئة جديدة</button>
      </div>
      <div class="cats-grid" id="cats-list"></div>
    </div>

    <!-- SETTINGS TAB -->
    <div class="tab-content" id="tab-settings">
      <div class="settings-card">
        <div class="settings-title">إعدادات الموقع</div>
        <div class="field-grid">
          <div class="field-group"><label class="field-label">اسم المتجر</label><input class="field-input" id="s-name" oninput="markDirty()"></div>
          <div class="field-group"><label class="field-label">الوصف المختصر</label><input class="field-input" id="s-tagline" oninput="markDirty()"></div>
          <div class="field-group field-full"><label class="field-label">عنوان الهيرو</label><input class="field-input" id="s-hero-title" oninput="markDirty()"></div>
          <div class="field-group field-full"><label class="field-label">نص الهيرو</label><input class="field-input" id="s-hero-sub" oninput="markDirty()"></div>
          <div class="field-group"><label class="field-label">إحصائية 1 — رقم</label><input class="field-input" id="s-s1n" oninput="markDirty()"></div>
          <div class="field-group"><label class="field-label">إحصائية 1 — تسمية</label><input class="field-input" id="s-s1l" oninput="markDirty()"></div>
          <div class="field-group"><label class="field-label">إحصائية 2 — رقم</label><input class="field-input" id="s-s2n" oninput="markDirty()"></div>
          <div class="field-group"><label class="field-label">إحصائية 2 — تسمية</label><input class="field-input" id="s-s2l" oninput="markDirty()"></div>
          <div class="field-group"><label class="field-label">إحصائية 3 — رقم</label><input class="field-input" id="s-s3n" oninput="markDirty()"></div>
          <div class="field-group"><label class="field-label">إحصائية 3 — تسمية</label><input class="field-input" id="s-s3l" oninput="markDirty()"></div>
          <div class="field-group"><label class="field-label">لون الموقع الرئيسي</label><input class="field-input" id="s-accent" type="color" oninput="markDirty()"></div>
          <div class="field-group"><label class="field-label">نص الفوتر</label><input class="field-input" id="s-footer" oninput="markDirty()"></div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;">
        <button class="btn-sm btn-primary" onclick="saveSettings()">💾 حفظ الإعدادات</button>
      </div>
    </div>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-overlay" id="prod-modal">
  <div class="modal">
    <div class="modal-title">
      <span id="prod-modal-title">منتج جديد</span>
      <button class="btn-sm" onclick="closeModal('prod-modal')">✕</button>
    </div>
    <div class="modal-fields">
      <div class="modal-row">
        <div class="field-group"><label class="field-label">اسم المنتج</label><input class="field-input" id="p-name"></div>
        <div class="field-group"><label class="field-label">الأيقونة (إيموجي)</label><input class="field-input" id="p-icon" style="font-size:22px;text-align:center;"></div>
      </div>
      <div class="modal-row">
        <div class="field-group"><label class="field-label">الفئة</label>
          <select class="field-input" id="p-cat"></select>
        </div>
        <div class="field-group"><label class="field-label">الشارة</label>
          <select class="field-input" id="p-badge">
            <option value="">بدون</option>
            <option value="hot">🔥 رائج</option>
            <option value="new">✦ جديد</option>
          </select>
        </div>
      </div>
      <div class="modal-row">
        <div class="field-group"><label class="field-label">السعر (ر.س)</label><input class="field-input" id="p-price" type="number"></div>
        <div class="field-group"><label class="field-label">الفترة</label><input class="field-input" id="p-period" placeholder="/شهر"></div>
      </div>
      <div class="field-group"><label class="field-label">الوصف</label><input class="field-input" id="p-desc"></div>
      <div class="field-group"><label class="field-label">لون الخلفية</label><input class="field-input" id="p-color" type="color"></div>
      <div class="field-group">
        <label class="field-label">المميزات</label>
        <div class="features-list" id="features-list"></div>
        <button class="btn-add-feature" onclick="addFeature()">+ أضف ميزة</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" onclick="closeModal('prod-modal')">إلغاء</button>
      <button class="btn-sm btn-primary" onclick="saveProduct()">💾 حفظ</button>
    </div>
  </div>
</div>

<!-- CAT MODAL -->
<div class="modal-overlay" id="cat-modal">
  <div class="modal">
    <div class="modal-title">
      <span id="cat-modal-title">فئة جديدة</span>
      <button class="btn-sm" onclick="closeModal('cat-modal')">✕</button>
    </div>
    <div class="modal-fields">
      <div class="field-group"><label class="field-label">المعرّف (بالإنجليزي)</label><input class="field-input" id="c-id" placeholder="مثل: streaming"></div>
      <div class="field-group"><label class="field-label">الاسم بالعربي</label><input class="field-input" id="c-label"></div>
      <div class="field-group"><label class="field-label">الأيقونة (إيموجي)</label><input class="field-input" id="c-icon" style="font-size:22px;text-align:center;"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" onclick="closeModal('cat-modal')">إلغاء</button>
      <button class="btn-sm btn-primary" onclick="saveCat()">💾 حفظ</button>
    </div>
  </div>
</div>

<!-- SAVE BAR -->
<div class="save-bar" id="save-bar">
  <div class="save-bar-text">⚠️ عندك تغييرات غير محفوظة — انسخ البيانات وحدّث ملفات GitHub</div>
  <div style="display:flex;gap:10px;">
    <button class="btn-sm btn-primary" onclick="exportData()">📋 نسخ البيانات</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PASS = 'dz-admin-2025';
let products = [], categories = [], settings = {}, editingProdId = null, editingCatId = null, isDirty = false;

// ===== AUTH =====
function doLogin(){
  const v = document.getElementById('pass-input').value;
  if(v === PASS){
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('main-wrap').style.display = 'block';
    loadData();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}
function doLogout(){
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('main-wrap').style.display = 'none';
  document.getElementById('pass-input').value = '';
}

// ===== DATA =====
function loadData(){
  const sp = localStorage.getItem('dz_products');
  const sc = localStorage.getItem('dz_categories');
  const ss = localStorage.getItem('dz_settings');
  products = sp ? JSON.parse(sp) : INIT_PRODUCTS;
  categories = sc ? JSON.parse(sc) : INIT_CATS;
  settings = ss ? JSON.parse(ss) : INIT_SETTINGS;
  renderAll();
}
function saveData(){
  localStorage.setItem('dz_products', JSON.stringify(products));
  localStorage.setItem('dz_categories', JSON.stringify(categories));
  localStorage.setItem('dz_settings', JSON.stringify(settings));
}
function markDirty(){isDirty=true;document.getElementById('save-bar').classList.add('show');}

// ===== TABS =====
function switchTab(name, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

// ===== RENDER =====
function renderAll(){renderProducts();renderCats();renderSettings();}

function renderProducts(){
  document.getElementById('prod-count').textContent = '('+products.length+')';
  const list = document.getElementById('products-list');
  list.innerHTML = products.map(p => `
    <div class="table-row">
      <div class="row-icon">${p.icon}</div>
      <div><div class="row-name">${p.name}</div><div class="row-desc">${p.desc||''}</div></div>
      <div class="row-cat h-cat">${getCatLabel(p.category)}</div>
      <div class="row-price">${p.price} ر.س</div>
      <div class="row-badge h-badge">
        ${p.badge==='hot'?'<span class="badge badge-hot">🔥 رائج</span>':p.badge==='new'?'<span class="badge badge-new">✦ جديد</span>':'<span class="badge-none">—</span>'}
      </div>
      <div class="row-actions">
        <button class="btn-edit" onclick="openProductModal(${p.id})">تعديل</button>
        <button class="btn-del" onclick="deleteProduct(${p.id})">✕</button>
      </div>
    </div>`).join('');
}

function renderCats(){
  const list = document.getElementById('cats-list');
  list.innerHTML = categories.map(c => `
    <div class="cat-card">
      <div class="cat-icon">${c.icon}</div>
      <div class="cat-info"><div class="cat-label">${c.label}</div><div class="cat-id">${c.id}</div></div>
      <div class="cat-actions">
        <button class="btn-edit" onclick="openCatModal('${c.id}')">✏️</button>
        <button class="btn-del" onclick="deleteCat('${c.id}')">✕</button>
      </div>
    </div>`).join('');
}

function renderSettings(){
  const s = settings;
  document.getElementById('s-name').value = s.site_name||'';
  document.getElementById('s-tagline').value = s.site_tagline||'';
  document.getElementById('s-hero-title').value = s.hero_title||'';
  document.getElementById('s-hero-sub').value = s.hero_subtitle||'';
  document.getElementById('s-s1n').value = s.stat1_num||'';
  document.getElementById('s-s1l').value = s.stat1_label||'';
  document.getElementById('s-s2n').value = s.stat2_num||'';
  document.getElementById('s-s2l').value = s.stat2_label||'';
  document.getElementById('s-s3n').value = s.stat3_num||'';
  document.getElementById('s-s3l').value = s.stat3_label||'';
  document.getElementById('s-accent').value = s.accent_color||'#3b82f6';
  document.getElementById('s-footer').value = s.footer_text||'';
}

function getCatLabel(id){
  const c = categories.find(x=>x.id===id);
  return c ? c.icon+' '+c.label : id;
}

// ===== PRODUCTS MODAL =====
function openProductModal(id=null){
  editingProdId = id;
  document.getElementById('prod-modal-title').textContent = id ? 'تعديل المنتج' : 'منتج جديد';
  const catSel = document.getElementById('p-cat');
  catSel.innerHTML = categories.map(c=>`<option value="${c.id}">${c.icon} ${c.label}</option>`).join('');
  if(id){
    const p = products.find(x=>x.id===id);
    document.getElementById('p-name').value = p.name;
    document.getElementById('p-icon').value = p.icon;
    document.getElementById('p-cat').value = p.category;
    document.getElementById('p-badge').value = p.badge||'';
    document.getElementById('p-price').value = p.price;
    document.getElementById('p-period').value = p.period;
    document.getElementById('p-desc').value = p.desc||'';
    document.getElementById('p-color').value = p.color||'#0f0f0f';
    renderFeatures(p.features||[]);
  } else {
    document.getElementById('p-name').value='';
    document.getElementById('p-icon').value='📦';
    document.getElementById('p-badge').value='';
    document.getElementById('p-price').value='';
    document.getElementById('p-period').value='/شهر';
    document.getElementById('p-desc').value='';
    document.getElementById('p-color').value='#0f0f0f';
    renderFeatures([]);
  }
  document.getElementById('prod-modal').classList.add('open');
}

function renderFeatures(feats){
  const list = document.getElementById('features-list');
  list.innerHTML = feats.map((f,i)=>`
    <div class="feature-item">
      <input class="field-input" value="${f}" placeholder="ميزة...">
      <button class="btn-rm-feature" onclick="this.parentElement.remove()">✕</button>
    </div>`).join('');
}
function addFeature(){
  const list = document.getElementById('features-list');
  const div = document.createElement('div');
  div.className = 'feature-item';
  div.innerHTML = `<input class="field-input" placeholder="ميزة..."><button class="btn-rm-feature" onclick="this.parentElement.remove()">✕</button>`;
  list.appendChild(div);
}

function saveProduct(){
  const name = document.getElementById('p-name').value.trim();
  if(!name){showToast('أدخل اسم المنتج');return;}
  const features = [...document.querySelectorAll('#features-list .field-input')].map(i=>i.value.trim()).filter(Boolean);
  const data = {
    name, icon:document.getElementById('p-icon').value,
    category:document.getElementById('p-cat').value,
    badge:document.getElementById('p-badge').value,
    price:parseInt(document.getElementById('p-price').value)||0,
    period:document.getElementById('p-period').value,
    desc:document.getElementById('p-desc').value,
    color:document.getElementById('p-color').value,
    features
  };
  if(editingProdId){
    const idx = products.findIndex(x=>x.id===editingProdId);
    products[idx] = {...products[idx],...data};
  } else {
    data.id = Date.now();
    products.push(data);
  }
  saveData(); renderProducts(); markDirty();
  closeModal('prod-modal');
  showToast(editingProdId ? '✅ تم تعديل المنتج' : '✅ تم إضافة المنتج');
}

function deleteProduct(id){
  if(!confirm('تأكيد حذف المنتج؟')) return;
  products = products.filter(p=>p.id!==id);
  saveData(); renderProducts(); markDirty();
  showToast('🗑️ تم حذف المنتج');
}

// ===== CATS MODAL =====
function openCatModal(id=null){
  editingCatId = id;
  document.getElementById('cat-modal-title').textContent = id ? 'تعديل الفئة' : 'فئة جديدة';
  if(id){
    const c = categories.find(x=>x.id===id);
    document.getElementById('c-id').value = c.id;
    document.getElementById('c-label').value = c.label;
    document.getElementById('c-icon').value = c.icon;
    document.getElementById('c-id').disabled = true;
  } else {
    document.getElementById('c-id').value='';
    document.getElementById('c-label').value='';
    document.getElementById('c-icon').value='📦';
    document.getElementById('c-id').disabled = false;
  }
  document.getElementById('cat-modal').classList.add('open');
}

function saveCat(){
  const id = document.getElementById('c-id').value.trim();
  const label = document.getElementById('c-label').value.trim();
  if(!id||!label){showToast('أكمل البيانات');return;}
  const data = {id, label, icon:document.getElementById('c-icon').value};
  if(editingCatId){
    const idx = categories.findIndex(x=>x.id===editingCatId);
    categories[idx] = data;
  } else {
    if(categories.find(x=>x.id===id)){showToast('المعرّف موجود مسبقاً');return;}
    categories.push(data);
  }
  saveData(); renderCats(); markDirty();
  closeModal('cat-modal');
  showToast('✅ تم حفظ الفئة');
}

function deleteCat(id){
  if(!confirm('تأكيد حذف الفئة؟')) return;
  categories = categories.filter(c=>c.id!==id);
  saveData(); renderCats(); markDirty();
  showToast('🗑️ تم حذف الفئة');
}

// ===== SETTINGS =====
function saveSettings(){
  settings = {
    site_name:document.getElementById('s-name').value,
    site_tagline:document.getElementById('s-tagline').value,
    hero_title:document.getElementById('s-hero-title').value,
    hero_subtitle:document.getElementById('s-hero-sub').value,
    stat1_num:document.getElementById('s-s1n').value,
    stat1_label:document.getElementById('s-s1l').value,
    stat2_num:document.getElementById('s-s2n').value,
    stat2_label:document.getElementById('s-s2l').value,
    stat3_num:document.getElementById('s-s3n').value,
    stat3_label:document.getElementById('s-s3l').value,
    accent_color:document.getElementById('s-accent').value,
    footer_text:document.getElementById('s-footer').value,
  };
  saveData(); markDirty();
  showToast('✅ تم حفظ الإعدادات');
}

// ===== EXPORT =====
function exportData(){
  const data = {
    products: JSON.stringify(products, null, 2),
    categories: JSON.stringify(categories, null, 2),
    settings: JSON.stringify(settings, null, 2)
  };
  const text = `=== products.json ===\n${data.products}\n\n=== categories.json ===\n${data.categories}\n\n=== settings.json ===\n${data.settings}`;
  navigator.clipboard.writeText(text).then(()=>{
    showToast('✅ تم نسخ البيانات — الصقها في Claude لتحديث GitHub');
  });
}

// ===== UTILS =====
function closeModal(id){document.getElementById(id).classList.remove('open');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
